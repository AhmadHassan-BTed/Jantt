<svg width="168" height="64" viewBox="0 0 168 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jantt-bg-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10192A"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="jantt-acc-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="jantt-b1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="jantt-b2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="jantt-b3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="jantt-glow-hero" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Icon Mark (64x64 scaled inside 0 0 64 64) -->
  <g transform="translate(0, 0)">
    <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#jantt-bg-g)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.4"/>
    
    <!-- JSON Left Curly Brace: { -->
    <path d="M 17 15 C 13 15 11 18 11 23 C 11 27 9 30 6.5 32 C 9 34 11 37 11 41 C 11 46 13 49 17 49" stroke="url(#jantt-acc-g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#jantt-glow-hero)"/>
    
    <!-- Gantt Bar 1: Planning -->
    <rect x="19" y="17" width="16" height="6" rx="3" fill="url(#jantt-b1)"/>
    
    <!-- Dependency link -->
    <path d="M 35 20 L 38 20 L 38 29 L 40 29" stroke="#94A3B8" stroke-width="1.8" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Gantt Bar 2: Execution -->
    <rect x="27" y="28" width="18" height="6" rx="3" fill="url(#jantt-b2)"/>
    
    <!-- Gantt Bar 3: Delivery -->
    <rect x="19" y="39" width="13" height="6" rx="3" fill="url(#jantt-b3)"/>
    
    <!-- Milestone Diamond -->
    <rect x="38.5" y="39" width="6" height="6" rx="1.2" transform="rotate(45 41.5 42)" fill="#F59E0B"/>
    
    <!-- JSON Right Curly Brace: } -->
    <path d="M 47 15 C 51 15 53 18 53 23 C 53 27 55 30 57.5 32 C 55 34 53 37 53 41 C 53 46 51 49 47 49" stroke="url(#jantt-acc-g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#jantt-glow-hero)"/>
  </g>

  <!-- Typography (Pure Vector Outlines — Zero Font Dependency) -->
  <g id="jantt-wordmark">
    <!-- Letter J (Cyan) -->
    <path d="M 87 16 L 93 16 L 93 37.5 C 93 42.5 89.5 45 83.5 45 C 77.5 45 74.5 41.5 74.5 37 L 80.2 37 C 80.2 39.5 81.8 40.5 83.5 40.5 C 85.8 40.5 87 39.2 87 37 Z" fill="#38BDF8"/>

    <!-- Letter a (White) -->
    <path d="M 108 24 L 113.2 24 L 113.2 44 L 108.2 44 L 108.2 41.8 C 107 43.6 104.6 44.8 101.8 44.8 C 96.5 44.8 93.2 40.8 93.2 34.5 C 93.2 28.2 96.8 24.2 102 24.2 C 104.8 24.2 106.8 25.2 108 27 Z M 108 34.5 C 108 31 106 28.8 103.2 28.8 C 100.5 28.8 98.8 31 98.8 34.5 C 98.8 38 100.5 40.2 103.2 40.2 C 106 40.2 108 38 108 34.5 Z" fill="#FFFFFF"/>

    <!-- Letter n (White) -->
    <path d="M 118 24 L 123.5 24 L 123.5 27.2 C 124.8 25.2 127.2 24.2 130 24.2 C 135 24.2 137.2 27.5 137.2 32.5 L 137.2 44 L 131.8 44 L 131.8 33.5 C 131.8 30 130.4 28.5 127.5 28.5 C 124.6 28.5 123.5 30.5 123.5 33.8 L 123.5 44 L 118 44 Z" fill="#FFFFFF"/>

    <!-- Letter t1 (White) -->
    <path d="M 144.5 18 L 150 18 L 150 24 L 153.5 24 L 153.5 28.5 L 150 28.5 L 150 38.5 C 150 40.2 150.8 40.8 152.5 40.8 L 153.5 40.8 L 153.5 44.5 C 152.2 44.8 150.5 44.8 148.5 44.8 C 145.2 44.8 144.5 43 144.5 39.5 L 144.5 28.5 L 141.5 28.5 L 141.5 24 L 144.5 24 Z" fill="#FFFFFF"/>

    <!-- Letter t2 (White) -->
    <path d="M 158.5 18 L 164 18 L 164 24 L 167.5 24 L 167.5 28.5 L 164 28.5 L 164 38.5 C 164 40.2 164.8 40.8 166.5 40.8 L 167.5 40.8 L 167.5 44.5 C 166.2 44.8 164.5 44.8 162.5 44.8 C 159.2 44.8 158.5 43 158.5 39.5 L 158.5 28.5 L 155.5 28.5 L 155.5 24 L 158.5 24 Z" fill="#FFFFFF"/>
  </g>
</svg>
