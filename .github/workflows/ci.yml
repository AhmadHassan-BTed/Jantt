name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both active LTS lines; the floor is "engines" in the root package.json.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Test Android customization scripts
        run: node --test apps/android-twa/scripts/apply-customizations.test.mjs

      - name: Install Dependencies
        run: npm ci

      # Build first: typecheck and several test suites consume the built @jantt/core.
      - name: Build All Packages
        run: npm run build

      - name: Lint (TypeScript Typecheck & CLI Syntax)
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Install phone test browsers
        if: matrix.node-version == '22.x'
        run: npx playwright install --with-deps chromium webkit

      - name: Test phone workflows against the production build
        if: matrix.node-version == '22.x'
        run: npm run test:phone --workspace @jantt/playground

      - name: Verify Published Package Contents
        run: npm run check:packages

  python:
    name: Python Bridge Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Python Tests
        run: python -m unittest discover -s python/tests

  ci-gate:
    name: CI Gate
    needs: [validate, python]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify all CI jobs passed
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || [ "${{ needs.python.result }}" != "success" ]; then
            echo "CI failed: validate=${{ needs.validate.result }}, python=${{ needs.python.result }}"
            exit 1
          fi
          echo "All CI jobs passed (validate=${{ needs.validate.result }}, python=${{ needs.python.result }})."

