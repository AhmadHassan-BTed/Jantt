name: Feature Request / RFC
description: Suggest a new capability or architectural enhancement for Jantt
labels: ["enhancement", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new feature for Jantt.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is this feature request related to a specific problem or planning workflow?
      placeholder: Describe the use case...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Schema Design
      description: How should the feature work, and what would the JSON schema additions look like?
      placeholder: Describe the proposed solution...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds considered.
