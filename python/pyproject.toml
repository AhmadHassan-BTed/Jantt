[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jantt"
version = "1.0.0"
description = "Universal Python bridge for Jantt JSON Gantt chart engine (Jupyter, Streamlit, Pandas)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ahmad Hassan", email = "ahmadhassan.me@gmail.com" }
]
keywords = ["gantt", "timeline", "jupyter", "streamlit", "pandas", "project-management", "scheduling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3.0"]
polars = ["polars>=0.18.0"]
jupyter = ["ipython>=7.0.0"]
streamlit = ["streamlit>=1.15.0"]
all = ["pandas>=1.3.0", "ipython>=7.0.0", "streamlit>=1.15.0"]

[tool.setuptools.packages.find]
where = ["src"]
