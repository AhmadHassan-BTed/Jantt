services:
  playground:
    build:
      context: .
      dockerfile: Dockerfile
    image: jantt-playground:latest
    container_name: jantt-playground
    restart: unless-stopped
    ports:
      # Defaults to 8080 so it never collides with the `npm run dev` server on 5173.
      - "${PLAYGROUND_HTTP_PORT:-8080}:8080"
    # Static site served by unprivileged nginx: no writes outside /tmp, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
